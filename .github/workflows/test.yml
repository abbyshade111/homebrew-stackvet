# Installs the formula from source on a Mac and on Linux and runs its test, as a person would.
# Run on every push and pull request, by hand, and weekly, since a head-only formula builds
# whatever StackVet's main is that day.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/checkout@v5
      - name: Use this checkout as the tap
        run: |
          tap="$(brew --repository)/Library/Taps/abbyshade111/homebrew-stackvet"
          mkdir -p "$(dirname "$tap")"
          rm -rf "$tap"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - run: brew audit abbyshade111/stackvet/sv
      - run: brew install --HEAD --verbose abbyshade111/stackvet/sv
      - run: brew test abbyshade111/stackvet/sv
      - run: sv --version
      # On 9 October 2026 one Linux run stopped with Homebrew's "Empty installation" and the rerun of the
      # same commit passed; the log could not be read where it was looked at. If it comes back, this shows
      # what was installed, where Homebrew built, and how it is set up.
      - name: What was installed, when anything failed
        if: failure()
        run: |
          brew config || true
          ls -laR "$(brew --cellar)/sv" 2>&1 | head -50 || true
          ls -la "$(brew --prefix)/bin/sv" 2>&1 || true
          df -h || true
