# Installs the formulas from source on a Mac and on Linux and runs their tests, as a person would: for `sv`,
# the release a plain install builds and StackVet's main, which --HEAD builds; for `cv` and `av`,
# the release a plain install builds (from StackVet v0.3.0 for `cv`, backlog 0694, and v0.3.1 for `av`, backlog 0724). Run on every push and pull
# request, by hand, and weekly, since --HEAD builds whatever main is that day.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"
permissions:
  contents: read
  # To read this job's own check run, for the name the ruleset knows it by.
  checks: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        build: [release, head]
    runs-on: ${{ matrix.os }}
    steps:
      # The "Protect main" ruleset requires each install job by its full name, matrix values included, such as
      # "install (macos-latest, head)". A job renamed, or a value added to the matrix, would not be required, and a
      # formula that fails there could still merge. So each job reads its own name from its check run (a name built
      # here from the matrix would miss a new matrix key) and fails when the rules for main do not require it.
      # What this misses: a job removed from here stays required and never reports, so pull requests wait on it.
      - name: This job is a required check on main
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          if [ -z "$CHECK_RUN_ID" ]; then
            echo "::error::job.check_run_id is empty, so this job cannot look up its own name"
            exit 1
          fi
          name="$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" --jq .name)"
          required="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')"
          echo "This job: $name"
          echo "Required on main:"
          echo "$required" | sed 's/^/  /'
          if ! grep -qxF -- "$name" <<<"$required"; then
            echo "::error::The job \"$name\" is not a required check on main, so a pull request could merge without it. Add it to the \"Protect main\" ruleset's required checks, or give the job back a name the ruleset requires."
            exit 1
          fi
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/checkout@v5
      - name: Use this checkout as the tap
        run: |
          tap="$(brew --repository)/Library/Taps/abbyshade111/homebrew-stackvet"
          mkdir -p "$(dirname "$tap")"
          rm -rf "$tap"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - run: brew audit abbyshade111/stackvet/sv
      # A --HEAD install that Homebrew calls an "Empty installation" because StackVet's main moved while it built is
      # retried once, saying so; nothing else is (StackVet backlog 0697; the script says why). Its tests run first.
      - name: The install script's own tests
        run: .github/scripts/test-install-sv.sh
      - name: Install (${{ matrix.build }})
        run: .github/scripts/install-sv.sh ${{ matrix.build }}
      - run: brew test abbyshade111/stackvet/sv
      - run: sv --version
      # On 9 October 2026 one Linux run stopped with Homebrew's "Empty installation" and the rerun of the
      # same commit passed; the log could not be read where it was looked at. This step's listing on 21 November
      # showed why (StackVet backlog 0697). If anything else fails, it shows what was installed, where Homebrew
      # built, and how it is set up.
      - name: What was installed, when anything failed
        if: failure()
        run: |
          brew config || true
          ls -laR "$(brew --cellar)/sv" 2>&1 | head -50 || true
          ls -la "$(brew --prefix)/bin/sv" 2>&1 || true
          df -h || true
  install-cv:
    # ConfigVet's `cv`, the release a plain install builds: its own job, so the four `install` jobs keep the names the
    # ruleset requires. Its two jobs, "install-cv (macos-latest)" and "install-cv (ubuntu-latest)", are required
    # too, and check that they are, as the others do.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: This job is a required check on main
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          if [ -z "$CHECK_RUN_ID" ]; then
            echo "::error::job.check_run_id is empty, so this job cannot look up its own name"
            exit 1
          fi
          name="$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" --jq .name)"
          required="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')"
          echo "This job: $name"
          echo "Required on main:"
          echo "$required" | sed 's/^/  /'
          if ! grep -qxF -- "$name" <<<"$required"; then
            echo "::error::The job \"$name\" is not a required check on main, so a pull request could merge without it. Add it to the \"Protect main\" ruleset's required checks, or give the job back a name the ruleset requires."
            exit 1
          fi
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/checkout@v5
      - name: Use this checkout as the tap
        run: |
          tap="$(brew --repository)/Library/Taps/abbyshade111/homebrew-stackvet"
          mkdir -p "$(dirname "$tap")"
          rm -rf "$tap"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - run: brew audit abbyshade111/stackvet/cv
      - name: Install (release)
        run: brew install --verbose abbyshade111/stackvet/cv
      - run: brew test abbyshade111/stackvet/cv
      - run: cv --version
      - name: What was installed, when anything failed
        if: failure()
        run: |
          brew config || true
          ls -laR "$(brew --cellar)/cv" 2>&1 | head -50 || true
          ls -la "$(brew --prefix)/bin/cv" 2>&1 || true
          df -h || true
  install-av:
    # AgentVet's `av`, the release a plain install builds (from StackVet v0.3.1, its first; backlog 0724): its own job,
    # as `cv`'s is. Its two jobs, "install-av (macos-latest)" and "install-av (ubuntu-latest)", are required too, and
    # check that they are, as the others do.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: This job is a required check on main
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          if [ -z "$CHECK_RUN_ID" ]; then
            echo "::error::job.check_run_id is empty, so this job cannot look up its own name"
            exit 1
          fi
          name="$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" --jq .name)"
          required="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')"
          echo "This job: $name"
          echo "Required on main:"
          echo "$required" | sed 's/^/  /'
          if ! grep -qxF -- "$name" <<<"$required"; then
            echo "::error::The job \"$name\" is not a required check on main, so a pull request could merge without it. Add it to the \"Protect main\" ruleset's required checks, or give the job back a name the ruleset requires."
            exit 1
          fi
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/checkout@v5
      - name: Use this checkout as the tap
        run: |
          tap="$(brew --repository)/Library/Taps/abbyshade111/homebrew-stackvet"
          mkdir -p "$(dirname "$tap")"
          rm -rf "$tap"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - run: brew audit abbyshade111/stackvet/av
      - name: Install (release)
        run: brew install --verbose abbyshade111/stackvet/av
      - run: brew test abbyshade111/stackvet/av
      - run: av --version
      - name: What was installed, when anything failed
        if: failure()
        run: |
          brew config || true
          ls -laR "$(brew --cellar)/av" 2>&1 | head -50 || true
          ls -la "$(brew --prefix)/bin/av" 2>&1 || true
          df -h || true
